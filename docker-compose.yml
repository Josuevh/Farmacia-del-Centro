version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: farmacia
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  web:
    build: .
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/farmacia
      - SECRET_KEY=change_this
      - STRIPE_API_KEY=
      - STRIPE_WEBHOOK_SECRET=
    volumes:
      - ./backend:/app/backend
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

volumes:
  db-data:
